# Runs R CMD check on every push and pull request.  Based on the canonical
# workflow at https://github.com/r-lib/actions/tree/v2/examples
#
# The R-hub workflow alongside this one stays manual: it covers the unusual
# platforms (valgrind, gcc-san, older toolchains) that are worth a look before
# a CRAN submission but not on every commit.
#
# PhyloMeasures was archived from CRAN, so it cannot be resolved from the
# repositories.  DESCRIPTION carries a Remotes: entry pointing at the archived
# source, which pak honours; it needs a compiler but no system libraries.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Run the tests that skip_on_cran() holds back.  They are skipped on CRAN
      # because they are slow, not because they are unreliable, and CI is where
      # we want them exercised.
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
